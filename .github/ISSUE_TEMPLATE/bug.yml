name: Bug report
description: Unexpected output, crash or wrong type
labels: [bug]
body:
  - type: textarea
    id: input
    attributes:
      label: Input profile (JSON)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
