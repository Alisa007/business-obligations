name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Lets the coverage bot start CI on its branch (pull requests opened with GITHUB_TOKEN do not trigger it).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Node policy: the library supports Node 20+ (the compat job runs the built package on 20, 22 and 24); the
  # repository's tooling supports Node 20.19+ (the node-floor job), and day-to-day development uses the current LTS.
  check:
    runs-on: ubuntu-latest
    steps:
      # Squash merges make the PR title the commit subject, and releases are versioned from it.
      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|revert|docs|chore|ci|build|test|refactor|style)(\([a-z0-9._/-]+\))?!?: .+'
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "PR title must look like 'feat(scope): add thing', 'fix: correct thing' or 'chore: tidy'." >&2
            echo "  feat -> minor release, fix/perf/revert -> patch, type! -> breaking; docs/chore/ci/build/test/refactor/style -> no release." >&2
            echo "Got: $TITLE" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run size
      # The playground is a static Next.js export of the built library; building it here catches breakage early.
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/core/dist

  compat:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages/core/dist
      - name: Smoke test the built package (CJS, ESM, CLI, examples)
        working-directory: packages/core
        run: |
          node -e 'const m=require("./dist/index.cjs"); if(!m.getComplianceItems({entityType:"llc",zip:"94105",city:"San Francisco",county:"San Francisco"}).length) process.exit(1)'
          node --input-type=module -e 'import {getComplianceItems} from "./dist/index.js"; if(!getComplianceItems({entityType:"llc",zip:"94105",city:"San Francisco",county:"San Francisco"}).length) process.exit(1)'
          node dist/cli.js --zip 94105 --entity llc | grep -q "FEDERAL"
          node examples/quickstart.cjs
          node examples/quickstart.mjs > /dev/null
          node dist/cli.js rules --json | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))'

  # The oldest Node the repository claims to support: type-check, lint, test and build the playground on it.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
