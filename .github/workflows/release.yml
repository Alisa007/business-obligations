name: Release

# Continuous deployment with automatic versioning and a generated changelog, using only normal pull requests (no
# personal access token, no bypass of branch protection).
#
# This workflow POLLS instead of waiting for a push: pull requests merged by the auto-merge workflow are merged by
# github-actions[bot], and GitHub does not start workflows for pushes made with the Actions token. A schedule, a
# push (when a person merges) and a manual run all do the same thing: look at the repository and decide the next step.
#
#   publish  package.json has a version that is neither on npm nor tagged (the release PR was merged):
#            check, pack, smoke test, approval of the "npm" environment, npm publish, then a vX.Y.Z GitHub release,
#            which creates the tag at that exact commit.
#   prepare  otherwise, if releasable Conventional Commit titles landed since the last tag (feat, fix, perf, revert,
#            or a breaking change; only commits touching packages/core): open or update ONE pull request,
#            "chore(release): vX.Y.Z", from release/next that sets the version and adds the generated CHANGELOG.md
#            section (hand-written Unreleased notes are kept). CI is started on the branch and auto-merge enabled.
#   tag      the version is on npm but untagged (a previous run stopped after publishing): create the release.
#   none     nothing to do.
#
# Version rules (packages/core/scripts/auto-release.mjs): feat -> minor; fix, perf, revert -> patch; breaking ->
# major (minor before 1.0); docs, chore, ci, build, test, refactor, style do not release.
#
# The job that can publish never installs dependencies. Authentication, either of:
#   - npm trusted publishing (no secret): on npmjs.com open the package, Settings, Trusted Publisher, GitHub
#     Actions, workflow release.yml, environment "npm". Provenance is attached automatically.
#   - an NPM_TOKEN secret stored on the "npm" environment (granular token with publish rights and bypass-2FA).
# Run it by hand (Actions > Release > Run workflow): with "dry run" on it only prints what it would do.

on:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths: ["packages/core/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would happen; do not open a pull request or publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to see whether the last run failed
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the last release

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(node -p "require('./packages/core/package.json').version")
          tagged=false; git rev-parse -q --verify "refs/tags/v$pkg" >/dev/null && tagged=true
          published=false; npm view "business-obligations@$pkg" version >/dev/null 2>&1 && published=true
          mode=none; version=""
          if [ "$published" = false ] && [ "$tagged" = false ]; then
            mode=publish; version=$pkg
          elif [ "$published" = true ] && [ "$tagged" = false ]; then
            mode=tag; version=$pkg
          else
            out=$(node packages/core/scripts/auto-release.mjs)
            echo "$out"
            version=$(node -p "JSON.parse(process.argv[1]).version || ''" "$out")
            [ -n "$version" ] && mode=prepare
          fi
          # Back off: after a failed run (for example the npm trusted publisher is not configured yet), scheduled
          # polls do not rebuild and retry every 20 minutes. A push or a manual run always goes ahead.
          if [ "$mode" != none ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            recent=$(gh run list --workflow release.yml --limit 10 --json databaseId,conclusion,createdAt --jq \
              "[.[] | select(.databaseId != $GITHUB_RUN_ID and .conclusion != null and .conclusion != \"cancelled\" and .conclusion != \"skipped\")][0] | select(.conclusion == \"failure\" and ((now - (.createdAt | fromdateiso8601)) < 21600)) | .databaseId" || true)
            if [ -n "$recent" ]; then
              echo "Run $recent failed less than 6 hours ago; not retrying on a schedule (run the workflow by hand to retry)." | tee -a "$GITHUB_STEP_SUMMARY"
              mode=none; version=""
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release plan: **$mode** ${version:+(v$version)}" | tee -a "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'prepare' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release/next branch
      pull-requests: write
      actions: write # start CI on that branch (pull requests opened with GITHUB_TOKEN do not trigger it)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Dependency install scripts must not run in a release pipeline.
      - run: npm ci --ignore-scripts

      - name: Write the release files
        id: ver
        run: |
          out=$(node packages/core/scripts/auto-release.mjs --apply --notes "$RUNNER_TEMP/notes.md")
          echo "$out"
          echo "version=$(node -p "JSON.parse(process.argv[1]).version" "$out")" >> "$GITHUB_OUTPUT"
          npx prettier --write packages/core/CHANGELOG.md packages/core/package.json

      - name: Open or update the release pull request
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          branch=release/next
          # Nothing to do when the open release branch already carries exactly these files.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch -q origin "$branch"
            if git diff --quiet "origin/$branch" -- packages/core/package.json packages/core/CHANGELOG.md; then
              echo "release/next is already up to date for v$VERSION"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add packages/core/package.json packages/core/CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push --force origin "$branch"

          gh label create release --description "Automated release pull request" 2>/dev/null || true
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" --title "chore(release): v$VERSION" \
              --body-file "$RUNNER_TEMP/notes.md" --label release
          else
            gh pr edit "$pr" --title "chore(release): v$VERSION" --body-file "$RUNNER_TEMP/notes.md"
          fi
          # Required checks match by name and commit, so CI run on the branch satisfies them.
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash

  build:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'publish' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Dependency install scripts must not run in a release pipeline.
      - run: npm ci --ignore-scripts

      - name: Release notes from the changelog
        run: |
          node -e '
            const log = require("fs").readFileSync("packages/core/CHANGELOG.md", "utf8");
            const start = log.indexOf("## [" + process.argv[1] + "]");
            if (start < 0) { console.log("See CHANGELOG.md"); process.exit(0); }
            const end = log.indexOf("\n## [", start + 1);
            console.log(log.slice(log.indexOf("\n", start) + 1, end < 0 ? undefined : end).trim());
          ' "$VERSION" > "$RUNNER_TEMP/notes.md"

      - run: npm run check
      - run: npm run build
      - run: npm run size

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w business-obligations --pack-destination "$RUNNER_TEMP/pack"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/pack/notes.md"
          ls -l "$RUNNER_TEMP/pack"

      - name: Smoke test the packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/pack/business-obligations-*.tgz
          node -e 'const m=require("business-obligations"); if(!m.getComplianceItems({entityType:"llc",zip:"94105",city:"San Francisco",county:"San Francisco"}).length) process.exit(1)'
          node --input-type=module -e 'import {getComplianceItems} from "business-obligations"; import {lookupZip} from "business-obligations/zip"; const p=lookupZip("78701"); if(!p||!getComplianceItems({entityType:"llc",zip:"78701",city:p.city,county:p.county}).length) process.exit(1)'
          npx --no-install business-obligations --zip 94105 --entity llc | grep -q FEDERAL

      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # GitHub release (creates the tag)
      id-token: write # npm provenance / trusted publishing
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/release

      - name: Publish with an npm token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish "$RUNNER_TEMP"/release/business-obligations-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing (OIDC)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish "$RUNNER_TEMP"/release/business-obligations-*.tgz --access public

      # Creates the vX.Y.Z tag at the release commit and the release page, with the changelog section.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release/notes.md" --target "$GITHUB_SHA"

  tag:
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'tag' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the release for an already published version
        run: |
          node -e '
            const log = require("fs").readFileSync("packages/core/CHANGELOG.md", "utf8");
            const start = log.indexOf("## [" + process.argv[1] + "]");
            if (start < 0) { console.log("See CHANGELOG.md"); process.exit(0); }
            const end = log.indexOf("\n## [", start + 1);
            console.log(log.slice(log.indexOf("\n", start) + 1, end < 0 ? undefined : end).trim());
          ' "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
