name: Release

# Continuous deployment with automatic versioning and no secrets beyond npm itself.
#
# On every merge to main that touches packages/core, the next version is decided from the Conventional Commit PR
# titles since the last v* tag (packages/core/scripts/auto-release.mjs): feat -> minor, fix/perf/revert -> patch,
# breaking -> major (minor before 1.0). Nothing releasable (docs, chore, ci, ...) means nothing is published.
# Nothing is committed to main: the version lives in the git tag and GitHub release, which this workflow creates, and
# package.json is only set inside the release build.
#
# Two jobs, so the job that can publish never installs dependencies:
#   build:   read-only; installs with scripts disabled, decides the version, runs the checks, packs and smoke-tests
#            the tarball, and writes the release notes.
#   publish: runs in the protected "npm" environment (a required reviewer must approve), has id-token: write, and
#            only publishes the tarball built above, then creates the vX.Y.Z release (which creates the tag).
#
# Authentication, either of:
#   - npm trusted publishing (no secret): on npmjs.com open the package, Settings, Trusted Publisher, GitHub
#     Actions, workflow release.yml, environment "npm". Provenance is attached automatically.
#   - an NPM_TOKEN secret stored on the "npm" environment (granular token with publish rights and bypass-2FA).
# Run it by hand (Actions > Release > Run workflow) with "dry run" on to see the version it would release.

on:
  push:
    branches: [main]
    paths: ["packages/core/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Decide the version, build, test and pack only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the last release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Dependency install scripts must not run in a release pipeline.
      - run: npm ci --ignore-scripts

      - name: Decide the version
        id: ver
        run: |
          out=$(node packages/core/scripts/auto-release.mjs --apply --notes "$RUNNER_TEMP/notes.md")
          echo "$out"
          v=$(node -p "JSON.parse(process.argv[1]).version || ''" "$out")
          if [ -z "$v" ]; then
            echo "No releasable commits (feat/fix/perf/revert/breaking) since the last tag; nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "business-obligations@$v" version >/dev/null 2>&1; then
            echo "business-obligations@$v is already on npm but has no tag; refusing to publish it again" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Will release v$v" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - run: npm run check
        if: steps.ver.outputs.publish == 'true'
      - run: npm run build
        if: steps.ver.outputs.publish == 'true'
      - run: npm run size
        if: steps.ver.outputs.publish == 'true'

      - name: Pack
        if: steps.ver.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w business-obligations --pack-destination "$RUNNER_TEMP/pack"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/pack/notes.md"
          ls -l "$RUNNER_TEMP/pack"

      - name: Smoke test the packed tarball
        if: steps.ver.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/pack/business-obligations-*.tgz
          node -e 'const m=require("business-obligations"); if(!m.getComplianceItems({entityType:"llc",zip:"94105",city:"San Francisco",county:"San Francisco"}).length) process.exit(1)'
          node --input-type=module -e 'import {getComplianceItems} from "business-obligations"; import {lookupZip} from "business-obligations/zip"; const p=lookupZip("78701"); if(!p||!getComplianceItems({entityType:"llc",zip:"78701",city:p.city,county:p.county}).length) process.exit(1)'
          npx --no-install business-obligations --zip 94105 --entity llc | grep -q FEDERAL

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.publish == 'true'
        with:
          name: npm-release
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # GitHub release (creates the tag)
      id-token: write # npm provenance / trusted publishing
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: ${{ runner.temp }}/release

      - name: Publish with an npm token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish "$RUNNER_TEMP"/release/business-obligations-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing (OIDC)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish "$RUNNER_TEMP"/release/business-obligations-*.tgz --access public

      # Creates the vX.Y.Z tag at the released commit and the release page, with the generated notes.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release/notes.md" --target "$GITHUB_SHA"
