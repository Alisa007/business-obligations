name: Release

# Continuous deployment with automatic versioning and a generated changelog, using only normal pull requests (no
# personal access token, no bypass of branch protection).
#
#   1. A merge to main that touches packages/core and contains a releasable Conventional Commit title (feat, fix,
#      perf, revert, or a breaking change) makes the "prepare" job open or update ONE pull request,
#      "chore(release): vX.Y.Z", from branch release/next. It sets the version in packages/core/package.json and adds
#      the generated section to CHANGELOG.md (hand-written Unreleased notes are kept). CI is started on the branch and
#      auto-merge is enabled, so it merges itself once the required checks pass.
#   2. The merge of that PR is itself a push to main whose title starts with "chore(release):". That run is the
#      "build" and "publish" jobs: check, pack, smoke test, approval of the "npm" environment, npm publish, and a
#      vX.Y.Z GitHub release (which creates the tag at that exact commit).
#
# Version rules (packages/core/scripts/auto-release.mjs): feat -> minor; fix, perf, revert -> patch; breaking ->
# major (minor before 1.0); docs, chore, ci, build, test, refactor, style do not release.
#
# The job that can publish never installs dependencies. Authentication, either of:
#   - npm trusted publishing (no secret): on npmjs.com open the package, Settings, Trusted Publisher, GitHub
#     Actions, workflow release.yml, environment "npm". Provenance is attached automatically.
#   - an NPM_TOKEN secret stored on the "npm" environment (granular token with publish rights and bypass-2FA).
# Run it by hand (Actions > Release > Run workflow): with "dry run" on it only prints the version it would release.

on:
  push:
    branches: [main]
    paths: ["packages/core/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the version that would be released; do not open the release pull request
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release/next branch
      pull-requests: write
      actions: write # start CI on that branch (pull requests opened with GITHUB_TOKEN do not trigger it)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, to find the last release

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Dependency install scripts must not run in a release pipeline.
      - run: npm ci --ignore-scripts

      - name: Decide the version and write the release files
        id: ver
        run: |
          out=$(node packages/core/scripts/auto-release.mjs --apply --notes "$RUNNER_TEMP/notes.md")
          echo "$out"
          v=$(node -p "JSON.parse(process.argv[1]).version || ''" "$out")
          if [ -z "$v" ]; then
            echo "No releasable commits (feat/fix/perf/revert/breaking) since the last tag; nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx prettier --write packages/core/CHANGELOG.md packages/core/package.json
          echo "version=$v" >> "$GITHUB_OUTPUT"
          { echo "Would release **v$v**"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the release pull request
        if: ${{ steps.ver.outputs.version != '' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          branch=release/next
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add packages/core/package.json packages/core/CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push --force origin "$branch"

          gh label create release --description "Automated release pull request" 2>/dev/null || true
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" --title "chore(release): v$VERSION" \
              --body-file "$RUNNER_TEMP/notes.md" --label release
          else
            gh pr edit "$pr" --title "chore(release): v$VERSION" --body-file "$RUNNER_TEMP/notes.md"
          fi
          # Required checks match by name and commit, so CI run on the branch satisfies them.
          gh workflow run ci.yml --ref "$branch"
          gh pr merge "$branch" --auto --squash

  build:
    # A push to main whose title starts with "chore(release):" is the merge of the release pull request.
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Version to publish
        id: ver
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "business-obligations@$v" version >/dev/null 2>&1; then
            echo "business-obligations@$v is already on npm but has no tag; refusing to publish it again" >&2
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from the changelog
        if: steps.ver.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e '
            const log = require("fs").readFileSync("packages/core/CHANGELOG.md", "utf8");
            const start = log.indexOf("## [" + process.argv[1] + "]");
            if (start < 0) { console.log("See CHANGELOG.md"); process.exit(0); }
            const end = log.indexOf("\n## [", start + 1);
            console.log(log.slice(log.indexOf("\n", start) + 1, end < 0 ? undefined : end).trim());
          ' "$VERSION" > "$RUNNER_TEMP/notes.md"

      - run: npm run check
        if: steps.ver.outputs.publish == 'true'
      - run: npm run build
        if: steps.ver.outputs.publish == 'true'
      - run: npm run size
        if: steps.ver.outputs.publish == 'true'

      - name: Pack
        if: steps.ver.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w business-obligations --pack-destination "$RUNNER_TEMP/pack"
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/pack/notes.md"
          ls -l "$RUNNER_TEMP/pack"

      - name: Smoke test the packed tarball
        if: steps.ver.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/pack/business-obligations-*.tgz
          node -e 'const m=require("business-obligations"); if(!m.getComplianceItems({entityType:"llc",zip:"94105",city:"San Francisco",county:"San Francisco"}).length) process.exit(1)'
          node --input-type=module -e 'import {getComplianceItems} from "business-obligations"; import {lookupZip} from "business-obligations/zip"; const p=lookupZip("78701"); if(!p||!getComplianceItems({entityType:"llc",zip:"78701",city:p.city,county:p.county}).length) process.exit(1)'
          npx --no-install business-obligations --zip 94105 --entity llc | grep -q FEDERAL

      - uses: actions/upload-artifact@v7
        if: steps.ver.outputs.publish == 'true'
        with:
          name: npm-release
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/pack/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # GitHub release (creates the tag)
      id-token: write # npm provenance / trusted publishing
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: ${{ runner.temp }}/release

      - name: Publish with an npm token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish "$RUNNER_TEMP"/release/business-obligations-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing (OIDC)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish "$RUNNER_TEMP"/release/business-obligations-*.tgz --access public

      # Creates the vX.Y.Z tag at the release commit and the release page, with the changelog section.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release/notes.md" --target "$GITHUB_SHA"
