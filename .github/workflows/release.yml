name: Release

# Publishes packages/core to npm, then creates a GitHub release. Triggers: a version tag (vX.Y.Z) is pushed, or a merge
# to main changes packages/core/package.json to a version that is not on npm yet (the tag is then created for you).
# To release: `npm run release -- patch`, open a PR, merge it.
#
# Two jobs, so the job that can publish never installs dependencies:
#   build:   read-only; installs with scripts disabled, runs the checks, packs and smoke-tests the tarball.
#   publish: runs in the protected "npm" environment (a required reviewer must approve), has id-token: write, and
#            only publishes the tarball built above.
#
# Authentication, either of:
#   - npm trusted publishing (no secret): on npmjs.com open the package, Settings, Trusted Publisher, GitHub
#     Actions, workflow release.yml, environment "npm". Provenance is attached automatically.
#   - an NPM_TOKEN secret stored on the "npm" environment (granular token, publish rights for this package only).
# Run it by hand (Actions > Release > Run workflow) with "dry run" on to build, test and pack without publishing.
# Tags v* can only be created by repository admins (ruleset "Protect release tags").

on:
  push:
    tags: ["v*"]
    # Continuous deployment: a merge to main that changes the package publishes it when that version is not on npm yet.
    branches: [main]
    paths: ["packages/core/package.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag $GITHUB_REF_NAME is not on main" >&2; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Dependency install scripts must not run in a release pipeline.
      - run: npm ci --ignore-scripts

      - name: Tag matches package version
        if: github.ref_type == 'tag'
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package version $v" >&2; exit 1; }

      - name: Version and whether it is already on npm
        id: ver
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "compliance-rules-engine@$v" version >/dev/null 2>&1; then
            echo "compliance-rules-engine@$v is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run check
      - run: npm run build
      - run: npm run size

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack -w compliance-rules-engine --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: Smoke test the packed tarball
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP"/pack/compliance-rules-engine-*.tgz
          node -e 'const m=require("compliance-rules-engine"); if(!m.getComplianceItems({entityType:"llc",zip:"94105",city:"San Francisco",county:"San Francisco"}).length) process.exit(1)'
          node --input-type=module -e 'import {getComplianceItems} from "compliance-rules-engine"; import {lookupZip} from "compliance-rules-engine/zip"; const p=lookupZip("78701"); if(!p||!getComplianceItems({entityType:"llc",zip:"78701",city:p.city,county:p.county}).length) process.exit(1)'
          npx --no-install compliance-rules-engine --zip 94105 --entity llc | grep -q FEDERAL

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ needs.build.outputs.publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.ref_type == 'tag' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance / trusted publishing
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pack

      - name: Publish with an npm token
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish "$RUNNER_TEMP"/pack/compliance-rules-engine-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing (OIDC)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish "$RUNNER_TEMP"/pack/compliance-rules-engine-*.tgz --access public

      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/core/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          v="$VERSION"
          node -e '
            const log = require("fs").readFileSync("packages/core/CHANGELOG.md", "utf8");
            const start = log.indexOf("## [" + process.argv[1] + "]");
            if (start < 0) { console.log("See CHANGELOG.md"); process.exit(0); }
            const end = log.indexOf("\n## [", start + 1);
            console.log(log.slice(log.indexOf("\n", start) + 1, end < 0 ? undefined : end).trim());
          ' "$v" > "$RUNNER_TEMP/notes.md"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            # Merge to main: the release creates the vX.Y.Z tag at the published commit.
            gh release create "v$v" --title "v$v" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi
